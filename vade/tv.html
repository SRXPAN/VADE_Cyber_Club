<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>VADE Cyber Club — TV Live Map</title>
  <meta name="theme-color" content="#07090e">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700;800&display=swap">
  <link rel="stylesheet" href="tv.css">

  <script src="config.js" defer></script>
  <script src="qr.js" defer></script>
  <script src="club-map.js" defer></script>
  <script src="tv.js" defer></script>
</head>
<body>
  <div class="tv-bg" aria-hidden="true"></div>
  <div class="tv tv--map-only" id="tvRoot">
    <div class="tv-left">
      <header class="tv-top">
        <div class="tv-brand">
          <img class="tv-brand__logo" id="tvLogo" src="assets/logo.svg" alt="" width="54" height="54" decoding="async">
          <div class="tv-brand__text">
            <span class="tv-brand__name" id="tvBrand">VADE</span>
            <h1 class="tv-brand__title" id="tvTitle">WOLNE KOMPUTERY</h1>
          </div>
        </div>

        <div class="tv-zones" id="tvZones"></div>

        <div class="tv-clock" id="tvClock" aria-live="off">--:--</div>
      </header>

      <main class="tv-stage" id="tvMap" aria-live="polite"></main>

      <footer class="tv-bottom">
        <div class="tv-legend" id="tvLegend"></div>
        <div class="tv-meta">
          <span class="tv-reconnect" id="tvReconnect" hidden>
            <i aria-hidden="true"></i>
            <span id="tvReconnectText">Reconnecting…</span>
          </span>
          <span class="tv-updated" id="tvUpdated"></span>
        </div>
      </footer>
    </div>

    <aside class="tv-right" id="tvRight" hidden>
      <section class="tv-banners" id="tvBanners" aria-live="off"></section>
      <section class="tv-qr-row" id="tvQrRow"></section>
    </aside>
  </div>
</body>
</html>
